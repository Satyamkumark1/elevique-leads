name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # SECURITY.md: secrets stay in src/server/**, only Supabase URL/anon key are public.
      - name: Secret boundary check
        run: |
          if grep -rnE 'process\.env\.(SUPABASE_SERVICE_ROLE_KEY|[A-Z_]*(SECRET|TOKEN|API_KEY|PRIVATE_KEY))' src --include='*.ts' --include='*.tsx' | grep -v '^src/server/'; then
            echo "Secret env var read outside src/server/"; exit 1
          fi
          if grep -rnoE 'NEXT_PUBLIC_[A-Z_]+' src .env.example | grep -vE 'NEXT_PUBLIC_SUPABASE_(URL|ANON_KEY)$'; then
            echo "Unexpected NEXT_PUBLIC_ variable"; exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: ./scripts/dev-env.sh
      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
